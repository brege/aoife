repos:
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: npx biome lint --write
        language: system
        files: '\.(ts|tsx|js|jsx|css)$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.63
    hooks:
      - id: ty
        args: [--project, backend, --locked]
