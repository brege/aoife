name: E2E Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify npm registry signatures
        # npm 11.16 (bundled with Node 24) applies min-release-age while
        # verifying lockfile signatures; 11.17 limits the gate to resolution
        run: npx --yes npm@11.17.0 audit signatures

      - name: Install Cypress binary
        run: ./node_modules/.bin/cypress install

      - name: Verify Cypress binary
        run: ./node_modules/.bin/cypress verify

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GAMESDB_PUBLIC_KEY: ${{ secrets.GAMESDB_PUBLIC_KEY }}
          VITE_DEV_SERVER_ORIGIN: http://localhost:5173

      - name: Upload benchmarks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-measurements
          path: test/measurements.json
          if-no-files-found: ignore
